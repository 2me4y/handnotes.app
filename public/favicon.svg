<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bookBg" x1="8" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="penBody" x1="36" y1="12" x2="54" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="penTip" x1="30" y1="36" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="0" y="4" width="64" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Notebook Base -->
  <g filter="url(#shadow)">
    <rect x="10" y="8" width="40" height="48" rx="7" fill="url(#bookBg)"/>
    <!-- Notebook Spine / Left Margin Line -->
    <path d="M19 8v48" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
    <!-- Ruling lines -->
    <path d="M25 22h18" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M25 30h14" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M25 38h16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M25 46h11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>

  <!-- Stylus / Pen drawing -->
  <g transform="rotate(-35 44 26)">
    <rect x="38" y="10" width="8" height="24" rx="2" fill="url(#penBody)"/>
    <path d="M38 34l4 8 4-8h-8z" fill="url(#penTip)"/>
    <circle cx="42" cy="42" r="1.2" fill="#38bdf8"/>
  </g>
</svg>